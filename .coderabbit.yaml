# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Rehearsal-only isolation: automatic review and PR-description summaries are
# disabled; manual review commands remain available.
reviews:
  high_level_summary: false
  auto_review:
    enabled: false
    description_keyword: ""
    auto_pause_after_reviewed_commits: 0
